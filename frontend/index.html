<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gabary V2: Navigation Temporelle Trafic</title>
    <style>
        body { font-family: system-ui, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 500px; margin: 0 auto; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #334155; }
        h1 { color: #f59e0b; margin-bottom: 5px; font-size: 1.5em; }
        p { color: #94a3b8; font-size: 0.9em; }
        input { background: #0f172a; border: 1px solid #475569; color: #fff; padding: 10px; border-radius: 6px; width: calc(100% - 24px); margin-bottom: 12px; text-align: center; font-size: 1em; }
        .grid-inputs { display: flex; gap: 8px; }
        .grid-inputs input { width: 33%; }
        button { background: #f59e0b; color: #0f172a; font-weight: bold; border: none; padding: 12px; border-radius: 6px; width: 100%; cursor: pointer; font-size: 1em; }
        button:hover { background: #d97706; }
        pre { background: #020617; color: #38bdf8; padding: 15px; border-radius: 8px; text-align: left; direction: ltr; overflow-x: auto; font-size: 0.9em; white-space: pre-wrap; }
        .footer { margin-top: 20px; font-size: 0.85em; color: #64748b; border-top: 1px solid #1e293b; padding-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Gabary V2: Navigation Temporelle Trafic</h1>
        <p>محرك التناظر التقويمي لـ 50,000 سنة شمسية وهجرية</p>

        <div class="card">
            <h3>استعلام اليوم المطلق (Day ID)</h3>
            <input type="number" id="day-input" value="1" placeholder="رقم اليوم (1 - 18,261,759)">
            <button type="button" id="btn-query-day">حساب الأحداث والتقويم المزدوَج</button>
        </div>

        <div class="card">
            <h3>حساب التاريخ الشمسي</h3>
            <div class="grid-inputs">
                <input type="number" id="solar-y" value="2026" placeholder="السنة">
                <input type="number" id="solar-m" value="9" placeholder="الشهر">
                <input type="number" id="solar-d" value="5" placeholder="اليوم">
            </div>
            <button type="button" id="btn-query-solar" style="margin-top: 10px;">تحويل التزامن الشمسي</button>
        </div>

        <div class="card">
            <h3>مخرجات التناظر التقويمي (JSON)</h3>
            <pre id="json-output">اضغط على أحد الأزرار أعلاه لعرض البيانات...</pre>
        </div>

        <div class="footer">
            إعداد وبحث: المهندس <strong>نميمش بن عيسى</strong> (Nemimeche Benaissa)<br>
            باحث ومطور مستقل
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
